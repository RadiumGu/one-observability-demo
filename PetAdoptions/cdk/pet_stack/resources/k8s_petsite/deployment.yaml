---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: "{{PETSITE_SA_ROLE}}"
  name: petsite-sa
  namespace: petadoptions
---
apiVersion: v1
kind: Service
metadata:
  name: service-petsite
  namespace: petadoptions
  annotations:
    scrape: "true"
    prometheus.io/scrape: "true"
spec:
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
  selector:
    app: petsite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsite-deployment
  namespace: petadoptions
spec:
  selector:
    matchLabels:
      app: petsite
  replicas: 2
  template:
    metadata:
      labels:
        app: petsite
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: petsite
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: petsite
      serviceAccountName: petsite-sa
      containers:
      - image: "{{ECR_IMAGE_URL}}"
        imagePullPolicy: Always
        name: petsite
        ports:
        - containerPort: 8080
          protocol: TCP
        # CPU/内存 request 与 limit。
        #
        # 这里原先**完全没有 resources 段**，后果不只是「调度器少一个提示」：
        #   · petsite-hpa 的 averageUtilization 是相对 request 的百分比，
        #     没有 request 就算不出利用率 —— 实测 `cpu: <unknown>/60%`，
        #     这个 HPA 已经失效 155 天，从未扩缩过一次。
        #   · 无 request 的 Pod 在调度打分和节点压力驱逐排序里都处于最不利位置，
        #     而 petsite 是入口服务、爆炸半径最大。
        #
        # 200m 的依据（2026-08-30 压测中 metrics-server 5 分钟 40 样本）：
        # pod 级 p50 34m / p90 50m / p99 69m —— 它是全命名空间用量最高的服务。
        # 取 ~3×p99，使 HPA 阈值 60%×200m=120m 落在 p99 的 1.74 倍处：
        # 既能在负载真正上来时扩容，又不会被日常波动误触发。
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "512m"
            memory: "1Gi"
        env:
        # ⚠️ 必须是 default 命名空间。xray-service 是 default 下的 headless
        # Service（UDP 2000），petadoptions 里**没有**这个 Service。
        # 这里曾写成 xray-service.petadoptions:2000，导致 segment 一直发往
        # 一个不存在的地址 —— 症状是 petsite 在 X-Ray 服务图里完全不出现，
        # 2026-08-29 定位并改为 .default 后入口边立刻出现。
        # 对照：pethistory 用的一直是正确的 xray-service.default:2000。
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service.default:2000
        - name: ASPNETCORE_URLS
          value: "http://+:8080"

        # ══════════════════════════════════════════════════════════════════
        # 上游新配置契约要求的 9 个**必需**环境变量。
        #
        # ⚠️ 缺任何一个都会让应用启动即抛：
        #     System.InvalidOperationException:
        #       Parameter name environment variable 'XXX_PARAM_NAME' is not set or is empty.
        #   （见 Configuration/ParameterNames.cs 第 36 行的硬抛）
        #   2026-09-04 18:00 部署新镜像后全站 502，就是因为这 9 个一个都没设。
        #
        # ⚠️ 这些变量存的是**参数的短名**，不是参数值本身 ——
        #   ParameterRefreshManager.GetParameterAsync 会拼成 `{prefix}/{短名}`
        #   （第 52 行），prefix 来自 PARAMETER_STORE_PREFIX，默认 /petstore。
        #   所以填 `searchapiurl` 而不是 `/petstore/searchapiurl`，也不是 URL 本身。
        # ══════════════════════════════════════════════════════════════════
        - name: PARAMETER_STORE_PREFIX
          value: "/petstore"
        - name: SEARCH_API_URL_PARAM_NAME
          value: "searchapiurl"
        - name: PET_LIST_ADOPTIONS_URL_PARAM_NAME
          value: "petlistadoptionsurl"
        - name: PAYMENT_API_URL_PARAM_NAME
          value: "paymentapiurl"
        - name: PET_HISTORY_URL_PARAM_NAME
          value: "pethistoryurl"
        - name: CLEANUP_ADOPTIONS_URL_PARAM_NAME
          value: "cleanupadoptionsurl"
        - name: RUM_SCRIPT_PARAMETER_NAME
          value: "rumscript"
        # agent 集成入口：petsite 靠这个参数拿到 orchestrator 的 runtime ARN。
        # 该参数由 WaggleAIAgents 栈创建（/petstore/agent/waggleairuntimearn），
        # 注意它**带完整路径**，因为不在 /petstore 前缀下 ——
        # GetParameterAsync 对以 / 开头的名字会直接用、不再拼前缀（第 52 行）。
        - name: WAGGLE_AI_RUNTIME_ARN_PARAM_NAME
          value: "/petstore/agent/waggleairuntimearn"
        # ⏸ petfood 的两个参数：服务尚未部署到 EKS，参数还不存在。
        #   这里仍然**必须设**（否则启动即抛），指向将来会建的短名；
        #   参数不存在时抛的是另一个异常（"Parameter value for ... is not found"），
        #   而那发生在**按请求读取**时而非启动时 ——
        #   所以食品相关页面会 500，其余页面正常。petfood 部署后自动恢复。
        - name: FOOD_API_URL_PARAM_NAME
          value: "petfoodapiurl"
        - name: CART_API_URL_PARAM_NAME
          value: "petfoodcarturl"
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-tgb
  namespace: petadoptions
spec:
  serviceRef:
    name: service-petsite
    port: 80
  targetGroupARN: "<arn-to-targetGroup>"
  targetType: ip
