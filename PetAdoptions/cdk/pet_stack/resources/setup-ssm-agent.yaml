# NOTE: SSM Agent DaemonSet and ConfigMap removed (2026-02-20).
# AL2023 nodes (ARM64/t4g) have SSM Agent pre-installed by default.
# The original jicowan/ssm-agent-installer:1.2 image was x86_64-only and
# caused CrashLoopBackOff on ARM64 nodes (exec format error).
# All EKS nodes confirmed Online in SSM without this DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: node-configuration-daemonset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ssm-agent-installer
rules:
- apiGroups: ['policy']
  resources: ['podsecuritypolicies']
  verbs:     ['use']
  resourceNames:
  - ssm-agent-installer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ssm-agent-installer
  namespace: node-configuration-daemonset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ssm-agent-installer
  namespace: node-configuration-daemonset 
roleRef:
  kind: ClusterRole
  name: ssm-agent-installer
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: ssm-agent-installer 
  namespace: node-configuration-daemonset
