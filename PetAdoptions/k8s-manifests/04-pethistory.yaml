# ⚠️ 双源警告 —— 本文件与 CDK 描述同一批对象
#
# 线上这些 Deployment/Service **同时**带 CDK 的 aws.cdk.eks/prune-* label
# 和 kubectl 的 last-applied-configuration 注解，说明两条路径都写过它们：
#   路径 A（CDK）：cdk/pet_stack/lib/services-eks.ts 与
#                  cdk/pet_stack/resources/k8s_petsite/deployment.yaml
#   路径 B（本目录）：../deploy-k8s.sh 会 kubectl apply 这些文件
# **谁最后跑谁生效。** 所以改 CPU/replicas 这类字段时两边必须同步改，
# 否则一次 cdk deploy 或一次 deploy-k8s.sh 就会把另一边的值覆盖掉。
#
# 2026-08-30 实测到的三个真实后果（都是只改一边造成的）：
#   · CDK 声明 search-service 128m，线上是 256m/512m —— CDK 那次 reduce 从未部署
#   · CDK 的 petsite manifest 没有 resources 段，导致 petsite-hpa 失效 155 天
#   · 本文件曾带一个 2026-08-29 已撤回的 aws-otel-collector sidecar，
#     跑一次 deploy-k8s.sh 就会把它重新加回入口服务
#
# PetHistory - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pethistory-deployment
  namespace: petadoptions
  labels:
    app: pethistory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pethistory
  template:
    metadata:
      labels:
        app: pethistory
    spec:
      serviceAccountName: pethistory-sa
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: pethistory
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app: pethistory
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      containers:
      - name: pethistory
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/pet-adoptions-history:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: "xray-service.default:2000"
        - name: AWS_REGION
          value: "<AWS_REGION>"
        - name: OTEL_OTLP_ENDPOINT
          value: "localhost:4317"
        - name: OTEL_RESOURCE
          value: "ClusterName=PetSite"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=AWSObservability,service.name=PetAdoptionsHistory"
        - name: S3_REGION
          value: "<AWS_REGION>"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: RDS_SECRET_ARN
          value: "REPLACE_WITH_RDS_SECRET_ARN"
        - name: UPDATE_ADOPTION_URL
          value: "REPLACE_WITH_UPDATE_ADOPTION_URL"
        livenessProbe:
          httpGet:
            path: /health/status
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: "32m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      - name: aws-otel-collector
        image: public.ecr.aws/aws-observability/aws-otel-collector:v0.47.0
        args:
        - --config=/etc/otel-config/otel-config.yaml
        env:
        - name: AWS_REGION
          value: "<AWS_REGION>"
        resources:
          requests:
            cpu: "32m"
            memory: "24Mi"
          limits:
            cpu: "256m"
            memory: "512Mi"
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-config
      volumes:
      - name: otel-config
        configMap:
          name: otel-config
---
apiVersion: v1
kind: Service
metadata:
  name: pethistory-service
  namespace: petadoptions
  labels:
    app: pethistory
spec:
  type: ClusterIP
  selector:
    app: pethistory
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
