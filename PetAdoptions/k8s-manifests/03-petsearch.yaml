# ⚠️ 双源警告 —— 本文件与 CDK 描述同一批对象
#
# 线上这些 Deployment/Service **同时**带 CDK 的 aws.cdk.eks/prune-* label
# 和 kubectl 的 last-applied-configuration 注解，说明两条路径都写过它们：
#   路径 A（CDK）：cdk/pet_stack/lib/services-eks.ts 与
#                  cdk/pet_stack/resources/k8s_petsite/deployment.yaml
#   路径 B（本目录）：../deploy-k8s.sh 会 kubectl apply 这些文件
# **谁最后跑谁生效。** 所以改 CPU/replicas 这类字段时两边必须同步改，
# 否则一次 cdk deploy 或一次 deploy-k8s.sh 就会把另一边的值覆盖掉。
#
# 2026-08-30 实测到的三个真实后果（都是只改一边造成的）：
#   · CDK 声明 search-service 128m，线上是 256m/512m —— CDK 那次 reduce 从未部署
#   · CDK 的 petsite manifest 没有 resources 段，导致 petsite-hpa 失效 155 天
#   · 本文件曾带一个 2026-08-29 已撤回的 aws-otel-collector sidecar，
#     跑一次 deploy-k8s.sh 就会把它重新加回入口服务
#
# Search Service - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: petadoptions
  labels:
    app: search-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: search-service
    spec:
      serviceAccountName: search-service-sa
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: search-service
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app: search-service
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      containers:
      - name: search-service
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/petadoptions/petsearch:latest
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "<AWS_REGION>"
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/app/aws-opentelemetry-agent.jar -XX:+PreserveFramePointer"
        # ⚠️ 与 CDK 双源：这三个探针同时由
        #    cdk/pet_stack/lib/services/eks-service.ts 生成（参数从
        #    lib/services-eks.ts 的 SearchServiceEks 传入：
        #    startupGraceSeconds: 150 / probeTimeoutSeconds: 5）。
        #    谁最后跑谁生效，改一边必须改另一边。
        #
        # startupProbe 存在的理由：应用实测 `Started Application in 31.091 seconds`，
        # 而原先 livenessProbe.initialDelaySeconds 是 30 —— 首次 liveness 恰好在
        # 应用起来之前打，HPA 扩容造成 CPU 争抢时必然进重启循环。
        # startupProbe 成功前 liveness 与 readiness 都不执行，于是
        # 「启动慢」与「运行中卡死」终于用两组独立参数表达。
        startupProbe:
          httpGet:
            path: /health/status
            port: 80
          periodSeconds: 5
          failureThreshold: 30      # 5s × 30 = 150s 启动宽限（实测启动时间约 5 倍）
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 0    # 有 startupProbe 后此值多余，不再各自猜启动时间
          periodSeconds: 10
          timeoutSeconds: 5         # JVM 的 GC 停顿在 1s（K8s 默认）下会被误杀
          failureThreshold: 3       # 10s × 3 = 30s 内发现真正的卡死
        readinessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: "256m"
            memory: "512Mi"
          limits:
            cpu: "512m"
            memory: "1Gi"
      - name: aws-otel-collector
        image: public.ecr.aws/aws-observability/aws-otel-collector:v0.47.0
        env:
        - name: AOT_CONFIG_CONTENT
          value: |
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              batch/traces:
                timeout: 1s
                send_batch_size: 50
            exporters:
              awsxray:
                region: <AWS_REGION>
            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [batch/traces]
                  exporters: [awsxray]
        resources:
          requests:
            cpu: "32m"
            memory: "256Mi"
          limits:
            cpu: "256m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: petadoptions
  labels:
    app: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
