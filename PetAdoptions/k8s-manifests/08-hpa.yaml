# HPA - Horizontal Pod Autoscalers for all PetAdoptions services
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: petsite-hpa
  namespace: petadoptions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petsite-deployment
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
