---
# PetHistory standalone deployment manifest
# NOTE: 主要的部署配置在 k8s-manifests/04-pethistory.yaml
#       此文件保留用于独立部署/调试 pethistory 服务
#
# ❗ 部署前必须替换 REPLACE_WITH_* 占位符！
#    推荐使用 deploy-k8s.sh 统一部署，不要直接 kubectl apply 此文件。
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_PETSITE_SA_ROLE"
  name: pethistory-sa
  namespace: petadoptions
---
apiVersion: v1
kind: Service
metadata:
  name: pethistory-service
  namespace: petadoptions
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
  selector:
    app: pethistory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pethistory-deployment
  namespace: petadoptions
spec:
  selector:
    matchLabels:
      app: pethistory
  replicas: 2
  template:
    metadata:
      labels:
        app: pethistory
    spec:
      serviceAccountName: pethistory-sa
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: pethistory
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app: pethistory
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      containers:
      - image: "REPLACE_WITH_ECR_IMAGE_URL"
        imagePullPolicy: Always
        name: pethistory
        ports:
        - containerPort: 8080
          protocol: TCP
        # ⚠️ 刻意**不在**这里声明 RDS_SECRET_ARN 与 UPDATE_ADOPTION_URL。
        # PetAdoptionsHistory 构造用 env.push() **追加**这两项（见
        # lib/applications/pet-adoptions-history-application.ts:105 与 :117），
        # 不是替换。若这里也声明，最终 manifest 会出现同名 env 两次 ——
        # K8s 取最后一个，真值虽然会赢，但形状恶劣且极易误读。
        #
        # 相关的线上既有缺陷（2026-08-30 实测）：线上 pethistory 的
        # UPDATE_ADOPTION_URL 当前值是字面量 `{{UPDATE_ADOPTION_URL}}` ——
        # 因为 deploy-k8s.sh 的 sed 只替换 REPLACE_WITH_* 形式，
        # 而被应用的那份文件里这一项还是旧的 {{}} 形式。走 CDK 部署会修好它。
        env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service.default:2000
        - name: AWS_REGION
          value: "REPLACE_WITH_AWS_REGION"
        - name: OTEL_OTLP_ENDPOINT
          value: "localhost:4317"
        - name: OTEL_RESOURCE
          value: ClusterName=REPLACE_WITH_CLUSTER_NAME
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=AWSObservability,service.name=PetAdoptionsHistory"
        - name: S3_REGION
          value: "REPLACE_WITH_AWS_REGION"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        # startupProbe：pethistory 实测「容器启动 -> Ready」耗时 **41 秒**
        #   （启动时要取 Secrets Manager 密钥、建 Aurora 连接、跑一次探测查询）。
        #   而 livenessProbe 是 initialDelay 30 + 3×10s = 最晚 60 秒才杀，
        #   余量只有 19 秒 —— 这正是 search-service 那次事故的同型风险
        #   （实测启动 31.091 秒 vs initialDelaySeconds 30，
        #    HPA 扩容造成 CPU 争抢时必然进重启循环，80 分钟内 restarts=3/1/3）。
        #
        #   K8s 规定 startupProbe 成功前 liveness 与 readiness 都不执行，
        #   所以「启动慢」与「运行中卡死」终于用两组独立参数表达，
        #   不再靠一个猜死的常数同时兼顾。
        #   30×5 = 最长 150 秒宽限，是实测 41 秒的 3.6 倍余量。
        #
        #   ⚠️ 对照：同批的 list-adoptions / pay-for-adoption / petfood 实测
        #   只需 6~7 秒，readinessProbe 的 initialDelay 5 + 3×5s 已足够覆盖，
        #   **刻意不给它们加 startupProbe** —— 按实测数据决定而非按服务类型推断。
        startupProbe:
          httpGet:
            path: /health/status
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health/status
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        # ⚠️ readinessProbe 原先**完全没有配**，这是一个真实缺陷而非遗漏细节：
        #    Kubernetes 在未配 readinessProbe 时，容器只要 Running 就无条件
        #    视为 Ready，而 Service 的 Endpoint 是按 Ready 选的 ——
        #    于是一个「所有请求包括 /health/status 都返回 500」的 Pod
        #    仍然在接收生产流量，且 kubectl 显示 ready=true。
        #
        #    这个场景真实发生过（2026-09-05）：一次 ALTER TABLE 打断了本进程
        #    持有的长连接上的事务，psycopg 连接进入 INERROR 状态后所有查询被拒。
        #    livenessProbe 确实检测到了（事件里有
        #    "Liveness probe failed: HTTP probe failed with statuscode: 500"）
        #    并最终重启了 Pod，但 liveness 的语义是「杀掉重来」，
        #    在它累计到 failureThreshold=3（即 30 秒）之前，
        #    Pod 一直是 Ready 状态、一直在接流量、一直返回 500。
        #    readinessProbe 才是「暂时别给我流量」那一层，两者不可互相替代。
        #
        #    参数选择：
        #    - periodSeconds 5 / failureThreshold 2 -> 最快 10 秒摘出流量，
        #      比 liveness 的 30 秒重启窗口更早生效，正是想要的先后顺序。
        #    - successThreshold 1 -> 恢复后立即重新接流量（连接自愈只需一次成功）。
        #    - initialDelaySeconds 5 -> 该服务是 Flask，启动很快；
        #      给 5 秒避免启动瞬间的无意义失败。
        #    - timeoutSeconds 3 -> /health/status 要真的查一次库，
        #      1 秒（K8s 默认）在 Aurora 偶发抖动时会误判。
        readinessProbe:
          httpGet:
            path: /health/status
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        resources:
          requests:
            # 32m 是实测右调后的值（2026-08-30 压测中 5 分钟 40 样本：
            # pod 级 p50 1m / p90 2m / p99 2m —— 全命名空间用量最低的服务）。
            # 原先 50m 相对实际用量虚高约 25 倍。32m 是刻意设的下限，
            # 仍留 16 倍余量；HPA 阈值 60%×(32+32)=38m ≈ p99 的 19 倍。
            cpu: "32m"
            memory: "128Mi"
          limits:
            # limit 保持 500m 不动 —— 它给的是突发上限，与 request 是两件事，
            # 降 request 不应连带压缩突发能力（见 EksServiceProps.cpuLimit 的说明）。
            cpu: "500m"
            memory: "1Gi"
      - name: aws-otel-collector
        image: public.ecr.aws/aws-observability/aws-otel-collector:v0.47.0
        args: ["--config=/etc/otel-config/otel-config.yaml"]
        env:
        - name: AWS_REGION
          value: "REPLACE_WITH_AWS_REGION"
        resources:
          limits:
            cpu: 256m
            memory: 512Mi
          requests:
            cpu: 32m
            memory: 24Mi
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otel-config
      volumes:
      - name: otel-config
        configMap:
          name: otel-config
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: pethistory-tgb
  namespace: petadoptions
spec:
  serviceRef:
    name: pethistory-service
    port: 8080
  targetGroupARN: "REPLACE_WITH_TARGET_GROUP_ARN"
  targetType: ip
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pethistory-otel-prometheus-role
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs:
    - /metrics
    verbs:
    - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pethistory-otel-prometheus-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pethistory-otel-prometheus-role
subjects:
  - kind: ServiceAccount
    name: pethistory-sa
    namespace: petadoptions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-awseksresourcedetector-role
rules:
  - apiGroups:
      - ""
    resourceNames:
      - aws-auth
      - cluster-info
    resources:
      - configmaps
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-awseksresourcedetector-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-awseksresourcedetector-role
subjects:
  - kind: ServiceAccount
    name: pethistory-sa
    namespace: petadoptions
