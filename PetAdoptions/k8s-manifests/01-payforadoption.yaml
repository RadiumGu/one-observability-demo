# PayForAdoption Service - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payforadoption
  namespace: petadoptions
  labels:
    app: payforadoption
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payforadoption
  template:
    metadata:
      labels:
        app: payforadoption
        version: v1
    spec:
      nodeSelector:
        arch: arm64  # Graviton 节点
      containers:
      - name: payforadoption
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/petadoptions/payforadoption:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: AWS_REGION
          value: "<AWS_REGION>"
        - name: RDS_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: petadoptions-config
              key: rds_endpoint
        - name: DB_NAME
          value: "adoptions"
        livenessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
# PayForAdoption Service
apiVersion: v1
kind: Service
metadata:
  name: payforadoption-service
  namespace: petadoptions
  labels:
    app: payforadoption
spec:
  type: NodePort
  selector:
    app: payforadoption
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
