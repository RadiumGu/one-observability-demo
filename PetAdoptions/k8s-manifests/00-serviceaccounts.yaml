# ServiceAccounts — IRSA annotations need to be replaced with actual role ARNs
#
# These ServiceAccounts are created by CDK. When deploying manually,
# replace the role ARN placeholders with actual IAM role ARNs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petsite-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_PETSITE_ROLE_ARN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pay-for-adoption-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_PAYFORADOPTION_ROLE_ARN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: list-adoptions-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_LISTADOPTIONS_ROLE_ARN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-service-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_SEARCHSERVICE_ROLE_ARN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pethistory-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_PETHISTORY_ROLE_ARN"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-generator-sa
  namespace: petadoptions
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_TRAFFICGENERATOR_ROLE_ARN"
