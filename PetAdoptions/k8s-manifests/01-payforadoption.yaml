# PayForAdoption Service - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay-for-adoption
  namespace: petadoptions
  labels:
    app: pay-for-adoption
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pay-for-adoption
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: pay-for-adoption
    spec:
      serviceAccountName: pay-for-adoption-sa
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: pay-for-adoption
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            app: pay-for-adoption
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      containers:
      - name: pay-for-adoption
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/petadoptions/payforadoption:latest
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: AWS_REGION
          value: "<AWS_REGION>"
        livenessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "128m"
            memory: "512Mi"
          limits:
            cpu: "512m"
            memory: "1Gi"
      - name: aws-otel-collector
        image: public.ecr.aws/aws-observability/aws-otel-collector:v0.47.0
        env:
        - name: AOT_CONFIG_CONTENT
          value: |
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              batch/traces:
                timeout: 1s
                send_batch_size: 50
            exporters:
              awsxray:
                region: <AWS_REGION>
            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [batch/traces]
                  exporters: [awsxray]
        resources:
          requests:
            cpu: "32m"
            memory: "256Mi"
          limits:
            cpu: "256m"
            memory: "256Mi"
---
# PayForAdoption Service
apiVersion: v1
kind: Service
metadata:
  name: pay-for-adoption
  namespace: petadoptions
  labels:
    app: pay-for-adoption
spec:
  type: ClusterIP
  selector:
    app: pay-for-adoption
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
