# External ALB Ingress - PetSite 前端 (需要部署后手动添加 Cognito 注解)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-alb-ingress
  namespace: petadoptions
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing  # 外部 ALB
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/load-balancer-name: PetAdoptions-External-ALB
    alb.ingress.kubernetes.io/group.name: petadoptions-external
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Cognito 认证配置 (部署后需要替换实际值)
    # alb.ingress.kubernetes.io/auth-type: cognito
    # alb.ingress.kubernetes.io/auth-idp-cognito: '{"userPoolArn":"REPLACE_WITH_USER_POOL_ARN","userPoolClientId":"REPLACE_WITH_CLIENT_ID","userPoolDomain":"REPLACE_WITH_DOMAIN"}'
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      # PetSite 前端 (默认路由)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: petsite-service
            port:
              number: 80
