---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: "{{PETSITE_SA_ROLE}}"
  name: petsite-sa
  namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: service-petsite
  namespace: default
  annotations:
    scrape: "true"
    prometheus.io/scrape: "true"
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
  selector:
    app: petsite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsite-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: petsite
  replicas: 2
  template:
    metadata:
      labels:
        app: petsite
    spec:
      # 打散策略：
      # 1. 跨 AZ 均匀分布（AZ 故障时只影响一半副本）
      # 2. 跨 Node 均匀分布（单节点故障时只影响一半副本）
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: petsite
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: petsite
      serviceAccountName: petsite-sa
      containers:
      - image: "{{ECR_IMAGE_URL}}"
        imagePullPolicy: Always
        name: petsite
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: AWS_XRAY_DAEMON_ADDRESS
          value: xray-service.default:2000
---
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: petsite-tgb
spec:
  serviceRef:
    name: service-petsite
    port: 80
  targetGroupARN: "<arn-to-targetGroup>"
  targetType: ip
