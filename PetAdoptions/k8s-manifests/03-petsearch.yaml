# Search Service - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petsearch
  namespace: petadoptions
  labels:
    app: petsearch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petsearch
  template:
    metadata:
      labels:
        app: petsearch
        version: v1
    spec:
      nodeSelector:
        arch: arm64
      containers:
      - name: petsearch
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/petadoptions/petsearch:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: AWS_REGION
          value: "<AWS_REGION>"
        livenessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/status
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: petsearch-service
  namespace: petadoptions
  labels:
    app: petsearch
spec:
  type: NodePort
  selector:
    app: petsearch
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
